services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeroneer}
      POSTGRES_USER: ${POSTGRES_USER:-aeroneer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aeroneer-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeroneer} -d ${POSTGRES_DB:-aeroneer}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  aeroneer-postgres:
